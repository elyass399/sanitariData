<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GDM Risk Predictor</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, sans-serif;
    background: #f5f5f5;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }
  .card {
    background: white;
    border-radius: 10px;
    padding: 2rem;
    width: 100%;
    max-width: 440px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  h1 { font-size: 1.3rem; margin-bottom: 0.25rem; color: #111; }
  .subtitle { font-size: 0.8rem; color: #888; margin-bottom: 1.5rem; }
  .field { margin-bottom: 1rem; }
  label { display: block; font-size: 0.78rem; color: #555; margin-bottom: 0.3rem; }
  input {
    width: 100%; padding: 0.55rem 0.75rem;
    border: 1px solid #ddd; border-radius: 6px;
    font-size: 0.9rem; outline: none; transition: border-color 0.2s;
  }
  input:focus { border-color: #4f6ef7; }
  button {
    width: 100%; padding: 0.75rem;
    background: #4f6ef7; color: white;
    border: none; border-radius: 6px;
    font-size: 0.95rem; font-weight: 600;
    cursor: pointer; margin-top: 0.5rem; transition: background 0.2s;
  }
  button:hover { background: #3a58e0; }
  button:disabled { background: #a0aff5; cursor: not-allowed; }
  .result { margin-top: 1.25rem; padding: 1rem; border-radius: 8px; display: none; }
  .result.low  { background: #f0faf4; border: 1px solid #4caf82; }
  .result.high { background: #fff5f5; border: 1px solid #e05c5c; }
  .result-label { font-weight: 700; font-size: 1rem; margin-bottom: 0.2rem; }
  .result.low  .result-label { color: #2d7a56; }
  .result.high .result-label { color: #c0392b; }
  .result-score { font-size: 0.8rem; color: #777; }
  .error { margin-top: 0.75rem; font-size: 0.8rem; color: #e05c5c; display: none; }
</style>
</head>
<body>
<div class="card">
  <h1>GDM Risk Predictor</h1>
  <p class="subtitle">Gestational Diabetes · Logistic Regression · AUC 0.69</p>
  <div class="field"><label>Age</label><input type="number" id="Age" placeholder="e.g. 30"></div>
  <div class="field"><label>BMI</label><input type="number" id="BMI" placeholder="e.g. 27.5" step="0.1"></div>
  <div class="field"><label>Serum Insulin 2h</label><input type="number" id="Serum_Insulin_2h" placeholder="e.g. 100" step="0.1"></div>
  <div class="field"><label>Diastolic BP (mmHg)</label><input type="number" id="Diastolic_BP_mmHg" placeholder="e.g. 75"></div>
  <div class="field"><label>Previous Pregnancies</label><input type="number" id="Previous_Pregnancies" placeholder="e.g. 1" min="0"></div>
  <div class="field"><label>Previous C-Sections</label><input type="number" id="Previous_C_Sections" placeholder="e.g. 0" min="0"></div>
  <button id="btn" onclick="predict()">Predict</button>
  <div class="result" id="result">
    <div class="result-label" id="result-label"></div>
    <div class="result-score" id="result-score"></div>
  </div>
  <div class="error" id="error"></div>
</div>
<script>
async function predict() {
  const btn = document.getElementById("btn");
  const res = document.getElementById("result");
  const err = document.getElementById("error");
  res.style.display = "none";
  err.style.display = "none";
  const fields = ["Age","BMI","Serum_Insulin_2h","Diastolic_BP_mmHg","Previous_Pregnancies","Previous_C_Sections"];
  const data = {};
  for (const f of fields) {
    const val = parseFloat(document.getElementById(f).value);
    if (isNaN(val)) { err.textContent = "Please fill all fields."; err.style.display = "block"; return; }
    data[f] = val;
  }
  btn.disabled = true; btn.textContent = "Loading...";
  try {
    const r = await fetch("http://127.0.0.1:5000/predict", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data)
    });
    const json = await r.json();
    const high = json.result.prediction === 1;
    res.className = "result " + (high ? "high" : "low");
    document.getElementById("result-label").textContent = json.result.label;
    document.getElementById("result-score").textContent = "Risk score: " + (json.result.risk_score * 100).toFixed(1) + "%";
    res.style.display = "block";
  } catch (e) {
    err.textContent = "Cannot reach API — is app.py running?";
    err.style.display = "block";
  } finally {
    btn.disabled = false; btn.textContent = "Predict";
  }
}
</script>
</body>
</html>
